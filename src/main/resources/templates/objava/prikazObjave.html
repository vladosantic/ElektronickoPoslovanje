<!-- Ažurirana skripta za dohvat i prikaz podataka o objavi -->
<script>



    document.addEventListener("DOMContentLoaded",
        function () {
            // Dohvati objavaId iz Thymeleaf atributa
            var objavaId = [[${objavaId}]]

            fetchComments(objavaId);

            // Dohvati podatke o objavi putem Fetch API-ja
            fetch("http://localhost:8080/api/objava/" + objavaId)
                .then(response => response.json())
                .then(async data => {
                    const loggedInUserId = await fetchLoggedInUserId();
                    const updateButton = document.getElementById("updateButton");
                    const deleteButton = document.getElementById("deleteButton");

                    if (loggedInUserId === data.korisnikId) {
                        updateButton.style.display = "inline-block";
                        deleteButton.style.display = "inline-block";
                    }

                    // Izračunaj razliku između trenutnog vremena i data.datumObjave
                    const currentTime = new Date().getTime();
                    const timeDifference = currentTime - new Date(data.datumObjave).getTime();

                    // Formatiraj razliku pomoću funkcije formatTimeDifference
                    const formattedTimeDifference = formatTimeDifference(timeDifference);
                    // Ažuriraj HTML s dohvaćenim podacima
                    document.getElementById("naslov").innerText = data.tekstObjave;
                    document.getElementById("imeLokacije").innerText = data.imeLokacije;
                    document.getElementById("imeZivotinje").innerText = data.imeZivotinje;
                    document.getElementById("imePrezime").innerText = data.imePrezime;
                    document.getElementById("datumObjave").innerText = formattedTimeDifference;
                    document.getElementById("imeZivotinje").innerHTML += `
                <button class="btn btn-outline-warning btn-sm ml-2" onclick="prikaziZivotinjuInfo(${data.zivotinjaId})">Više informacija</button>
`;
                    document.getElementById("imeLokacije").innerHTML += `
                <button class="btn btn-outline-warning btn-sm ml-2" onClick="prikaziLokacijuInfo(${data.lokacijaId})">Više
                    informacija</button>`;


                    // Dodaj event listener na delete dugme
                    document.getElementById("deleteButton").addEventListener("click", function () {
                        // Prikaži potvrdu prije brisanja
                        var confirmDelete = confirm("Jeste li sigurni da želite obrisati ovu objavu?");
                        if (confirmDelete) {
                            // Ako korisnik potvrdi brisanje, pošalji DELETE zahtjev na API
                            fetch("http://localhost:8080/api/objava/" + objavaId, {
                                method: "DELETE"
                            })
                                .then(response => {
                                    if (response.ok) {

                                        window.location.href = "http://localhost:8080/udomi";
                                    } else {
                                        console.error("Brisanje nije uspjelo.");
                                    }
                                })
                                .catch(error => console.error("Error:", error));
                        }
                    });
                    document.getElementById("updateButton").addEventListener("click", function () {
                        // Generiraj URL za uređivanje objave s odgovarajućim ID-om
                        var editUrl = "http://localhost:8080/objava/uredjivanje/" + objavaId;

                        // Preusmjeri korisnika na odabrani URL
                        window.location.href = editUrl;
                    });


                })
                .catch(error => console.error("Error:", error));



            // Handle form submission for adding a new comment
            document.getElementById("comment-form").addEventListener("submit", function (event) {
                event.preventDefault();
                addComment(objavaId);
            });

            const socket = new SockJS('http://localhost:8080/ws-endpoint');
            const stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                stompClient.subscribe(`/topic/commentUpdates/${objavaId}`, async function (update) {
                    console.log('Received update:', update);

                    const message = JSON.parse(update.body);
                    console.log('Parsed message:', message);
                    // Provjeravamo tip poruke i poduzimamo odgovarajuće akcije
                    if (message.messageType === 'New post added') {
                        fetchComments(objavaId);
                    }
                    if (message.messageType === 'Delete post') {

                        const commentElement = document.getElementById(`comment-${message.id}`);
                        if (commentElement) {
                            commentElement.remove();
                        }

                    }
                });
            });

        });

    function getUserById(userId) {
        // Kreirajte URL za GET zahtjev
        const url = `http://localhost:8080/api/users/${userId}`;

        // Vrati novi Promise
        return new Promise((resolve, reject) => {
            // Posaljite GET zahtjev
            fetch(url)
                .then(response => {
                    // Provjeri odgovor
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(userData => {
                    // Riješi Promise s podacima o korisniku
                    resolve(userData);
                })
                .catch(error => {
                    // Odbaci Promise s greškom
                    reject(error);
                });
        });
    }

    function formatTimeDifference(timeDifference) {
        const seconds = Math.floor(timeDifference / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);

        if (seconds < 60) {
            return `prije ${seconds} sekundi`;
        } else if (minutes < 60) {
            return `prije ${minutes} minuta`;
        } else if (hours < 24) {
            return `prije ${hours} sati`;
        } else if (days <= 30) {
            return `prije ${days} dana`;
        } else {
            // Default to formatted date if more than 30 days
            return new java.text.SimpleDateFormat("dd.MM.yyyy").format(timeDifference);
        }
    }
    async function fetchLoggedInUserId() {
        try {
            // Make a request to fetch the logged-in user ID
            const response = await fetch('http://localhost:8080/api/loggedInUserId');

            if (response.ok) {
                const data = await response.json();
                return data.userId;
            } else {
                throw new Error('Error fetching logged-in user ID');
            }
        } catch (error) {
            console.error('Error fetching logged-in user ID:', error);
            throw error;
        }
    }

    function prikaziZivotinjuInfo(zivotinjaId) {

        const zivotinjaInfoElement = document.getElementById("zivotinja-info");
        const currentDisplayStyle = window.getComputedStyle(zivotinjaInfoElement).display;// Postavi suprotnu vrijednost
        zivotinjaInfoElement.style.display = (currentDisplayStyle === "block") ? "none" : "block";

        if(window.getComputedStyle(zivotinjaInfoElement).display === "block"){
        // Dohvaćanje podataka o životinji putem Fetch API-ja
        fetch(`http://localhost:8080/api/zivotinja/${zivotinjaId}`)
            .then(response => response.json())
            .then(zivotinjaData => {
                // Prikazivanje informacija o životinji
                document.getElementById("zivotinja-info").innerHTML = `
                <h1>Informacije o životinji</h1>
                <p><b>Ime</b>: ${zivotinjaData.ime}</p>
                <p><b>Godine:</b> ${zivotinjaData.godine}</p>
                <p><b>Veličina:</b> ${zivotinjaData.velicina}</p>
                <p><b>Težina:</b> ${zivotinjaData.tezina} kg</p>
                <p><b>Vrsta:</b> ${zivotinjaData.nazivVrste}</p>
            `;
            })
            .catch(error => console.error("Error:", error));
        }
    }
    function prikaziLokacijuInfo(lokacijaId) {
        // Prikazivanje kontejnera za informacije o lokaciji
        const lokacijaInfoElement = document.getElementById("lokacija-info");
        const currentDisplayStyle = window.getComputedStyle(lokacijaInfoElement).display;// Postavi suprotnu vrijednost
        lokacijaInfoElement.style.display = (currentDisplayStyle === "block") ? "none" : "block";

        if(window.getComputedStyle(lokacijaInfoElement).display === "block"){

        // Dohvaćanje podataka o lokaciji putem Fetch API-ja
        fetch(`http://localhost:8080/api/lokacija/${lokacijaId}`)
            .then(response => response.json())
            .then(lokacijaData => {
                const lokacijaInfoElement = document.getElementById("lokacija-info");

                // Prikazi informacije o lokaciji
                lokacijaInfoElement.innerHTML = `
                <h1>Informacije o lokaciji</h1>
                <p><b>Naziv:</b> ${lokacijaData.naziv}</p>
                <p><b>Adresa:</b> ${lokacijaData.adresa}</p>
                <p><b>Grad:</b> ${lokacijaData.grad}</p>
                <p><b>Država:</b> ${lokacijaData.drzava}</p>
            `;
            })
            .catch(error => console.error("Error:", error));
        }
    }

    function fetchComments(objavaId) {
        fetch("http://localhost:8080/api/komentar")
            .then(response => response.json())
            .then(comments => {

                const filteredComments = filterCommentsByObjavaId(comments, objavaId);
                displayComments(filteredComments);
            })
            .catch(error => console.error("Error fetching comments:", error));
    }

    function filterCommentsByObjavaId(comments, objavaId) {
        return comments.filter(comment => comment.objavaId === objavaId);
    }

    async function displayComments(comments) {
        const commentsContainer = document.getElementById("comments-container");

        // Clear existing comments
        commentsContainer.innerHTML = "";

        // Check if there are no comments
        if (comments.length === 0) {
            commentsContainer.innerHTML = "<p>Nema komentara.</p>";
            return;
        }
        const currentTime = new Date().getTime();
        const loggedInUserId = await fetchLoggedInUserId();

        // Build HTML string for comments
        const commentsHTML = comments.map(comment => {
            const canDeleteComment = loggedInUserId === comment.korisnikId;

            return `
           <div class="comment mb-3" id="comment-${comment.id}" style="background-color: white; border-radius: 10px; padding: 15px;">
    <div class="d-flex">

        <!-- Comment Content -->
        <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-center">
                <!-- User Name and Comment Text -->
                <div>
                    <p class="mb-1"><strong>${comment.imePrezime}</strong>: ${comment.tekstKomentara}</p>
                    <small>${formatTimeDifference(currentTime - new Date(comment.datumKomentara).getTime())}</small>
                </div>

                <!-- Delete Button -->
                 ${canDeleteComment ? `<button class="btn btn-outline-danger btn-sm" onclick="deleteComment(${comment.id})">Obriši</button>` : ''}
                   </div>
        </div>
    </div>
</div>


        `;
        }).join('');

        // Set the HTML of the container
        commentsContainer.innerHTML = commentsHTML;
    }





    async function addComment(objavaId) {
        const commentText = document.getElementById("comment").value;
        const loggedInUserId = await fetchLoggedInUserId(); // Assuming you have a function to fetch the logged-in user ID

        const newComment = {
            objavaId: {
                id: objavaId
            },
            tekstKomentara: commentText,
            datumKomentara: new Date().toISOString(), // Use the current date and time
            korisnikId: {
                id: loggedInUserId
            }
            // Include other fields like korisnikId, etc., based on your API requirements
        };

        fetch("http://localhost:8080/api/komentar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(newComment)
        })
            .then(response => response.json())
            .then(addedComment => {

                //fetchComments(objavaId);
            })
            .catch(error => console.error("Error adding comment:", error));

        // Clear the comment input field
        document.getElementById("comment").value = "";
    }
    function deleteComment(commentId) {
        fetch(`http://localhost:8080/api/komentar/${commentId}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            },
        })
            .then(response => {
                if (response.ok) {
                    console.log("Komentar obrisan")
                } else {
                    console.error("Brisanje komentara nije uspjelo.");
                }
            })
            .catch(error => console.error("Error:", error));
    }








</script>
