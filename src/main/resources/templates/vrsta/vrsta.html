<div class="container mt-5">
    <h2>Vrste Životinja</h2>

    <table id="vrste-tabela" class="table table-hover"></table>




    <!-- Forma za dodavanje/ažuriranje -->
    <form id="vrsta-forma" class="mt-3">
        <div class="form-group">
            <label for="nazivVrste">Naziv vrste:</label>
            <input type="text" class="form-control" id="nazivVrste" required>
            <input type="hidden" class="form-control" id="idVrste" >
        </div>
        <button type="button" class="btn btn-success" onclick="dodajVrstu()">Dodaj</button>
        <button type="button" class="btn btn-warning" onclick="azurirajFormu()">Ažuriraj</button>
        <button type="button" class="btn btn-danger" onclick="obrisiVrstu()">Obriši</button>
    </form>
</div>
<!--Footer-->

    <div class="container text-center p-3" >

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    // Funkcija za dohvat vrsta s API-ja i prikaz u listi
    // Ažurirana funkcija za prikaz vrsta s dodatkom događaja na redak
    function prikaziVrste() {
        fetch('http://localhost:8080/api/vrsta')
            .then(response => response.json())
            .then(data => {
                const vrsteTabela = document.getElementById('vrste-tabela');
                vrsteTabela.innerHTML = ''; // Očisti tablicu prije dodavanja novih podataka

                // Dodaj zaglavlje tablice
                const thead = document.createElement('thead');
                thead.innerHTML = `
                <tr>
                    <th>Naziv vrste</th>
                </tr>
            `;
                vrsteTabela.appendChild(thead);

                // Dodaj redove tablice
                const tbody = document.createElement('tbody');
                data.forEach(vrsta => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${vrsta.nazivVrste}</td>

                `;

                    // Dodaj događaj klikanja na redak
                    tr.addEventListener('click', () => {
                        // Popuni formu kada korisnik klikne na redak
                        popuniFormu(vrsta.id);
                    });

                    tbody.appendChild(tr);
                });
                vrsteTabela.appendChild(tbody);
            })
            .catch(error => console.error('Greška pri dohvaćanju vrsta:', error));
    }




    // Funkcija za popunjavanje forme s podacima odabrane vrste
    function popuniFormu(id) {
        fetch(`http://localhost:8080/api/vrsta/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('nazivVrste').value = data.nazivVrste;
                document.getElementById('idVrste').value = data.id;
            })
            .catch(error => console.error('Greška pri dohvaćanju vrste za uređivanje:', error));
    }

    // Funkcija za dodavanje nove vrste
    function dodajVrstu() {
        const nazivVrste = document.getElementById('nazivVrste').value;

        fetch('http://localhost:8080/api/vrsta', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ nazivVrste }),
        })
            .then(response => response.json())
            .then(data => {
                console.log('Vrsta dodana:', data);
                document.getElementById('nazivVrste').value = '';
                document.getElementById('idVrste').value = '';
                prikaziVrste();
            })
            .catch(error => console.error('Greška pri dodavanju vrste:', error));
    }

    // Funkcija za ažuriranje vrste
    function azurirajFormu() {
        const nazivVrste = document.getElementById('nazivVrste').value;
        const id = document.getElementById('idVrste').value;

        // Provjerite je li naziv vrste unesen
        if (!nazivVrste) {
            alert('Unesite naziv vrste.');
            return;
        }

        // Pripremite podatke za slanje PUT zahtjeva
        const formData = {
            id: parseInt(id),
            nazivVrste: nazivVrste
        };

        // Pošaljite PUT zahtjev na API
        fetch(`http://localhost:8080/api/vrsta/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById('nazivVrste').value = '';
                    document.getElementById('idVrste').value = '';
                    prikaziVrste();
                } else {
                    console.error('Greška pri ažuriranju vrste:', response.status);
                    alert('Pogreška prilikom ažuriranja vrste.');
                }
            })
            .catch(error => {
                console.error('Greška pri ažuriranju vrste:', error);
                alert('Pogreška prilikom ažuriranja vrste.');
            });
    }



    function obrisiVrstu() {
        // Pitaj korisnika jeste li sigurni da želi obrisati
        const potvrda = confirm('Jeste li sigurni da želite obrisati ovu vrstu životinje?');
        const id = document.getElementById('idVrste').value;

        if (potvrda) {
            // Ako je korisnik potvrdio brisanje
            fetch(`http://localhost:8080/api/vrsta/${id}`, {
                method: 'DELETE',
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Vrsta obrisana');
                        document.getElementById('nazivVrste').value = '';
                        document.getElementById('idVrste').value = '';
                        prikaziVrste();
                    } else {
                        console.error('Greška pri brisanju vrste:', response.status);
                        // Prikazi obavijest o grešci
                        alert('Pogreška pri brisanju vrste.');
                    }
                })
                .catch(error => console.error('Greška pri brisanju vrste:', error));
        }
    }





    // Pri učitavanju stranice, prikaži vrste
    document.addEventListener('DOMContentLoaded', prikaziVrste);
</script>
