<div class="container mt-5">
    <h2>Lokacije</h2>

    <!-- Tablica za prikaz lokacija -->

    <table id="lokacije-tablica" class="table table-striped table-hover"></table>



    <!-- Forma za dodavanje/ažuriranje -->
    <form id="lokacija-forma" class="mt-3">
        <div class="form-group">
            <label for="nazivLokacije">Naziv lokacije:</label>
            <input type="text" class="form-control" id="nazivLokacije" required>
            <input type="hidden" class="form-control" id="idLokacije">
        </div>
        <div class="form-group">
            <label for="adresa">Adresa:</label>
            <input type="text" class="form-control" id="adresa" required>
        </div>
        <div class="form-group">
            <label for="grad">Grad:</label>
            <input type="text" class="form-control" id="grad" required>
        </div>
        <div class="form-group">
            <label for="drzava">Država:</label>
            <input type="text" class="form-control" id="drzava" required>
        </div>
        <button type="button" class="btn btn-success" onclick="dodajLokaciju()">Dodaj</button>
        <button type="button" class="btn btn-warning" onclick="azurirajLokaciju()">Ažuriraj</button>
        <button type="button" class="btn btn-danger" onclick="obrisiLokaciju()">Obriši</button>
    </form>
</div>

<!-- Footer -->

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    function prikaziLokacije() {
        fetch('http://localhost:8080/api/lokacija')
            .then(response => response.json())
            .then(data => {
                const lokacijeTable = document.getElementById('lokacije-tablica');
                lokacijeTable.innerHTML = ''; // Očisti tablicu prije dodavanja novih podataka

                // Dodajte redak s nazivima stupaca
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `
                <th>Naziv</th>
                <th>Adresa</th>
                <th>Grad</th>
                <th>Država</th>
            `;
                lokacijeTable.appendChild(headerRow);

                // Dodajte redak za svaku lokaciju
                data.forEach(lokacija => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${lokacija.naziv}</td>
                    <td>${lokacija.adresa}</td>
                    <td>${lokacija.grad}</td>
                    <td>${lokacija.drzava}</td>
                `;

                    // Dodajte event listener za popunjavanje forme
                    row.addEventListener('click', () => {
                        popuniLokacijuFormu(lokacija.id);
                    });

                    lokacijeTable.appendChild(row);
                });
            })
            .catch(error => console.error('Greška pri dohvaćanju lokacija:', error));
    }



    function popuniLokacijuFormu(id) {
        fetch(`http://localhost:8080/api/lokacija/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('nazivLokacije').value = data.naziv;
                document.getElementById('adresa').value = data.adresa;
                document.getElementById('grad').value = data.grad;
                document.getElementById('drzava').value = data.drzava;
                document.getElementById('idLokacije').value = data.id;
            })
            .catch(error => console.error('Greška pri dohvaćanju lokacije za uređivanje:', error));
    }

    function dodajLokaciju() {
        const nazivLokacije = document.getElementById('nazivLokacije').value;
        const adresa = document.getElementById('adresa').value;
        const grad = document.getElementById('grad').value;
        const drzava = document.getElementById('drzava').value;

        fetch('http://localhost:8080/api/lokacija', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ naziv: nazivLokacije, adresa, grad, drzava }),
        })
            .then(response => response.json())
            .then(data => {
                console.log('Lokacija dodana:', data);
                document.getElementById('nazivLokacije').value = '';
                document.getElementById('adresa').value = '';
                document.getElementById('grad').value = '';
                document.getElementById('drzava').value = '';
                document.getElementById('idLokacije').value = '';
                prikaziLokacije();
            })
            .catch(error => console.error('Greška pri dodavanju lokacije:', error));
    }

    function azurirajLokaciju() {
        const nazivLokacije = document.getElementById('nazivLokacije').value;
        const adresa = document.getElementById('adresa').value;
        const grad = document.getElementById('grad').value;
        const drzava = document.getElementById('drzava').value;
        const id = document.getElementById('idLokacije').value;

        if (!nazivLokacije) {
            alert('Unesite naziv lokacije.');
            return;
        }

        const formData = {
            id: parseInt(id),
            naziv: nazivLokacije,
            adresa,
            grad,
            drzava,
        };

        fetch(`http://localhost:8080/api/lokacija/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById('nazivLokacije').value = '';
                    document.getElementById('adresa').value = '';
                    document.getElementById('grad').value = '';
                    document.getElementById('drzava').value = '';
                    document.getElementById('idLokacije').value = '';
                    prikaziLokacije();
                } else {
                    console.error('Greška pri ažuriranju lokacije:', response.status);
                    alert('Pogreška prilikom ažuriranja lokacije.');
                }
            })
            .catch(error => {
                console.error('Greška pri ažuriranju lokacije:', error);
                alert('Pogreška prilikom ažuriranja lokacije.');
            });
    }

    function obrisiLokaciju() {
        const potvrda = confirm('Jeste li sigurni da želite obrisati ovu lokaciju?');
        const id = document.getElementById('idLokacije').value;

        if (potvrda) {
            fetch(`http://localhost:8080/api/lokacija/${id}`, {
                method: 'DELETE',
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Lokacija obrisana');
                        document.getElementById('nazivLokacije').value = '';
                        document.getElementById('adresa').value = '';
                        document.getElementById('grad').value = '';
                        document.getElementById('drzava').value = '';
                        document.getElementById('idLokacije').value = '';
                        prikaziLokacije();
                    } else {
                        console.error('Greška pri brisanju lokacije:', response.status);
                        alert('Pogreška pri brisanju lokacije.');
                    }
                })
                .catch(error => console.error('Greška pri brisanju lokacije:', error));
        }
    }

    document.addEventListener('DOMContentLoaded', prikaziLokacije);
</script>
