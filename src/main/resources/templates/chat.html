<body th:style="'background-image: url(' + @{/images/paw2.png} + '); background-size: cover;'">

        <!-- Navbar Items -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">

                    <a class="nav-link" th:href="@{/index}"><strong>Početna</strong></a>

                </li>
            </ul>

        </div>

<div class="container mt-5 mb-5 pb-5">
    <div class="alert alert-info mb-4" role="alert">
        Virtualni Savjetnik vam pomaže sa svim pitanjima o udomljavanju životinja. Ukoliko razmišljate o tome da pružite dom ljubimcu, slobodno postavite svoje pitanje i dobit ćete korisne informacije.
    </div>

    <div id="chat-container" class="mt-3">
        <!-- Chat sadržaj će se automatski generirati ovdje -->
    </div>

    <div class="input-group mt-3">
        <input type="text" class="form-control" id="prompt" placeholder="Unesite svoje pitanje...">
        <div class="input-group-append">
            <button class="btn btn-outline-warning" onclick="sendRequest()">Pošalji</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function sendRequest() {
        // Dohvati vrijednost unosa
        var userQuestion = document.getElementById('prompt').value;

        // Pripremi podatke za slanje
        var formData = new FormData();
        formData.append('prompt', userQuestion);

        // Dodaj korisničko pitanje u chat
        appendMessage('Vi', userQuestion, 'alert-success');

        // Stvarni Fetch API poziv prema API-ju s metodom POST
        fetch('http://localhost:8080/chat', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                // Ovdje bi trebali manipulirati odgovorom prema vašem API-ju
                var assistantResponse = data.choices[0].message.content;

                // Izdvoji tekst prije zadnje točke u odgovoru asistenta
                var truncatedResponse = assistantResponse.substr(0, assistantResponse.lastIndexOf('.'));

                // Dodaj odgovor asistenta u chat
                appendMessage('Pomoćnik za udomljavanje', truncatedResponse, 'alert-warning');

                // Isprazni polje za unos
                document.getElementById('prompt').value = "";
            })
            .catch(error => {
                console.log('Greška prilikom slanja zahtjeva:', error);
            });
    }

    function appendMessage(role, content, alertClass) {
        var chatContainer = document.getElementById('chat-container');
        var messageDiv = document.createElement('div');

        messageDiv.classList.add('alert', alertClass);
        messageDiv.role = 'alert';
        messageDiv.innerHTML = '<strong>' + role + ':</strong> ' + content;
        chatContainer.appendChild(messageDiv);
    }
</script>

</body>
</html>
