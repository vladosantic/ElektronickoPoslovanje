<div class="container mt-5">
    <h2>Uredi životinju</h2>
    <form action="#" method="post" id="editAnimalForm">
        <!-- Dodajte Thymeleaf varijable za popunjavanje forme -->
        <input type="hidden" th:name="objavaId" th:value="${objavaId}"/>

        <div class="mb-3">
            <label for="nazivVrste" class="form-label">Vrsta:</label>
            <select class="form-select" id="vrstaId" name="vrstaId" required></select>
        </div>
        <div class="mb-3">
            <label for="ime" class="form-label">Ime:</label>
            <input type="text" class="form-control" id="ime" name="ime"  required>
        </div>
        <div class="mb-3">
            <input type="hidden" class="form-control" id="id" name="id"  required>
        </div>
        <div class="mb-3">
            <label for="godine" class="form-label">Godine:</label>
            <input type="number" class="form-control" id="godine" name="godine"  required>
        </div>
        <div class="mb-3">
            <label for="velicina" class="form-label">Veličina:</label>
            <input type="text" class="form-control" id="velicina" name="velicina"  required>
        </div>
        <div class="mb-3">
            <label for="tezina" class="form-label">Težina:</label>
            <input type="number" class="form-control" id="tezina" name="tezina"  required>
        </div>
        <div class="mb-3">
            <label for="slika" class="form-label">Slika URL:</label>
            <input type="text" class="form-control" id="slika" name="slika"  required>
        </div>
        <button type="button" class="btn btn-warning" onclick="editAnimal()">Uredi životinju</button>
    </form>
</div>

<!--Footer-->
<footer class="bg-warning text-center text-lg-start text-white mt-5 animate__animated animate__fadeInRightBig">
    <div class="container text-center p-3">
        © 2024 Copyright:
        <a class="text-light" href="/index">udomi.ba</a>
    </div>
</footer>

<script>
    let objavaId = null;
    // Dodajte Thymeleaf varijable za popunjavanje dropdown liste
    window.onload = function () {
        objavaId = [[${objavaId}]]

        // Dohvat podataka o životinji i popunjavanje forme
        fetch(`http://localhost:8080/api/zivotinja/${objavaId}`)
            .then(response => response.json())
            .then(data => populateForm(data));
        fetch('http://localhost:8080/api/vrsta')
            .then(response => response.json())
            .then(data => populateDropdown(data));
    }

    function populateForm(animalData) {
        // Postavite vrijednosti forme s podacima iz baze
        document.getElementById('ime').value = animalData.ime;
        document.getElementById('id').value = animalData.id;
        selectTrueElement(animalData.vrstaId);
        document.getElementById('godine').value = animalData.godine;
        document.getElementById('velicina').value = animalData.velicina;
        document.getElementById('tezina').value = animalData.tezina;
        document.getElementById('slika').value = animalData.slika;
    }
    function populateDropdown(vrstaData) {
        const vrstaDropdown = document.getElementById('vrstaId');

        vrstaData.forEach(vrsta => {
            const option = document.createElement('option');
            option.value = vrsta.id;
            option.text = vrsta.nazivVrste;
            vrstaDropdown.appendChild(option);
        });
    }

    function editAnimal() {
        // Get form data
        const formData = {
            id: document.getElementById('id').value,
            ime: document.getElementById('ime').value,
            godine: parseInt(document.getElementById('godine').value, 10),
            velicina: document.getElementById('velicina').value,
            tezina: parseInt(document.getElementById('tezina').value, 10),
            slika: document.getElementById('slika').value,
            vrstaId: {
                id: parseInt(document.getElementById('vrstaId').value, 10)
            }
        };

        // Send PUT request
        fetch(`http://localhost:8080/api/zivotinja/${objavaId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
        })
            .then(response => {
                if (response.ok) {
                    console.log('Success:', response);
                    window.location.href = 'http://localhost:8080/zivotinje';
                } else {
                    console.error('Error:', response.status);
                    // Prikazivanje obavijesti o pogrešci
                    alert('Pogreška prilikom uređivanja životinje.');
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                // Prikazivanje obavijesti o pogrešci
                alert('Pogreška prilikom uređivanja životinje.');
            });
    }
    function selectTrueElement(selectedValue) {
        const vrstaDropdown = document.getElementById('vrstaId');

        // Prolazimo kroz opcije i postavljamo 'selected' na odabranoj opciji
        for (let i = 0; i < vrstaDropdown.options.length; i++) {
            if (vrstaDropdown.options[i].value == selectedValue) {
                vrstaDropdown.options[i].selected = true;
                break;  // Prekidamo petlju nakon postavljanja 'selected'
            }
        }
    }
</script>
