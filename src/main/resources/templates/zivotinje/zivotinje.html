<br /><br />
<div class="container">
    <!-- Display list of animals -->
    <div id="animalList" class="mt-5">
        <h2>Lista Životinja</h2>
        <a class="btn btn-warning" th:href="@{/zivotinja/dodaj}">Dodaj novu životinju</a>
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Ime</th>
                <th scope="col">Vrsta</th>
                <th scope="col">Godine</th>
                <th scope="col">Veličina</th>
                <th scope="col">Težina</th>
                <th scope="col">Akcije</th>

            </tr>
            </thead>
            <tbody id="animalTableBody">
            <!-- Animal data will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Button to add a new animal -->

</div>

<!--Footer-->

<footer class="bg-warning text-center text-lg-start text-white mt-5 animate__animated animate__fadeInRightBig">

    <div class="container text-center p-3" >
        © 2024 Copyright:
        <a class="text-light" href="/index">udomi.ba</a>
    </div>

</footer>
<script>
    // Fetch animal data from the API
    fetch('http://localhost:8080/api/zivotinja')
        .then(response => response.json())
        .then(data => displayAnimalList(data));

    // Function to display the list of animals
    function displayAnimalList(animalData) {
        const animalTableBody = document.getElementById('animalTableBody');

        animalData.forEach(animal => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${animal.ime}</td>
                <td>${animal.nazivVrste}</td>
                <td>${animal.godine}</td>
                <td>${animal.velicina}</td>
                <td>${animal.tezina}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editAnimal(${animal.id})">Uredi</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteAnimal(${animal.id})">Obriši</button>
                </td>

            `;
            animalTableBody.appendChild(row);
        });
    }
    function deleteAnimal(animalId) {
        // Confirm dialog to confirm the deletion
        if (confirm('Jeste li sigurni da želite obrisati ovu životinju?')) {
            // Send DELETE request
            fetch(`http://localhost:8080/api/zivotinja/${animalId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
            })
                .then(response => {
                    if (response.ok) {
                        location.reload()
                    } else {

                        alert('Postoji već objavljen oglas s ovom životinjom. Prvo obrišite oglas.');

                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
        }
    }
    function editAnimal(id) {
        // Konstruiraj URL za uređivanje životinje
        var editUrl = 'http://localhost:8080/zivotinja/uredi/' + id;

        // Preusmjeri na određeni URL
        window.location.href = editUrl;
    }

</script>
