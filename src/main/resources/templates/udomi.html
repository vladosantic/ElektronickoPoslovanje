<div class="container">


    <!-- Main Content -->

        <h1>Objave</h1>

        <!-- Styled Post List -->

            </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script>
        // Function to format the time difference
        function formatTimeDifference(timeDifference) {
            const seconds = Math.floor(timeDifference / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) {
                return `prije ${seconds} sekundi`;
            } else if (minutes < 60) {
                return `prije ${minutes} minuta`;
            } else if (hours < 24) {
                return `prije ${hours} sati`;
            } else if (days <= 30) {
                return `prije ${days} dana`;
            } else {
                // Default to formatted date if more than 30 days
                return new java.text.SimpleDateFormat("dd.MM.yyyy").format(timeDifference);
            }
        }

        // Function to display posts
        function displayPosts(posts) {
            // Sort posts by date in descending order
            posts.sort((a, b) => new Date(b.datumObjave) - new Date(a.datumObjave));

            const postList = document.getElementById('postList');
            postList.innerHTML = ''; // Clear previous posts

            posts.forEach(post => {
                const postItem = document.createElement('a');
                postItem.href = '/objava/' + post.id;
                postItem.classList.add('list-group-item', 'list-group-item-action', 'mb-3', 'rounded');

                const now = new Date();
                const postDate = new Date(post.datumObjave);
                const timeDifference = now - postDate;

                postItem.innerHTML = `
                <h5 class="mb-1">${post.tekstObjave}</h5>
                <p class="mb-1">${post.imePrezime}</p>
                <small>${formatTimeDifference(timeDifference)}</small>
            `;

                postList.appendChild(postItem);
            });
        }

        // Fetch initial data from the API
        fetch('http://localhost:8080/api/objava')
            .then(response => response.json())
            .then(data => {
                displayPosts(data);
                const posts = data; // Save the initial posts
            })
            .catch(error => console.error('Error:', error));

        function isUserAtTop() {
            return window.scrollY === 0;
        }

        const socket = new SockJS('http://localhost:8080/ws-endpoint');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/objavaUpdates', function (update) {
                const objava = JSON.parse(update.body);
                // Handle the received objava, e.g., update the UI
                fetch('http://localhost:8080/api/objava')
                    .then(response => response.json())
                    .then(data => {
                        displayPosts(data);
                        const posts = data; // Save the initial posts
                    })
                    .catch(error => console.error('Error:', error));
                notifyUserAndScrollToTop();
            });
        });



        function notifyUserAndScrollToTop() {
            if (!isUserAtTop()) {
                // Create a custom notification element
                const notification = document.createElement('div');
                notification.classList.add('custom-notification');
                notification.innerHTML = 'Imate novu objavu! Kliknite ovdje da biste je vidjeli.';

                // Append the notification to the body
                document.body.appendChild(notification);

                // Add a click event listener to the notification
                notification.addEventListener('click', function () {
                    // Scroll to the top when the notification is clicked
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });

                    // Remove the notification after it is clicked
                    document.body.removeChild(notification);
                });

                // Hide the notification after a certain time (e.g., 5 seconds)
                setTimeout(function () {
                    document.body.removeChild(notification);
                }, 5000);
            }
        }
    </script>
