<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava</title>
    <link rel="icon" th:href="@{/images/tablogo.png}" />
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <title>udomi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional: You can also include Bootstrap's JavaScript and dependencies if needed -->
    <!-- Bootstrap JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"></script>
    <!-- Popper.js (required for Bootstrap's JS) via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <!-- jQuery (required for Bootstrap's JS) via CDN -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

</head>
<body th:style="'background-image: url(' + @{/images/paw2.png} + '); background-size: cover;'">
<nav class="navbar navbar-expand-lg navbar-light bg-warning">
    <div class="container">

        <!-- Logo/Brand -->
        <a class="navbar-brand" href="/index">
            <img th:src="@{/images/udomilogo.png}" alt="Logo" height="45" class="d-inline-block align-top">
        </a>

        <!-- Navbar Toggler for mobile -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Items -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/register}"><strong>Registracija</strong></a>
                </li>

            </ul>



        </div>
    </div>
</nav>
<br /><br />
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">

            <div th:if="${param.error}">
                <div class="alert alert-danger">Nevažeća adresa e-pošte ili lozinka</div>
            </div>
            <div th:if="${param.logout}">
                <div class="alert alert-success"> Odjavljeni ste.</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">Prijava</h2>
                </div>
                <div class="card-body">
                    <form
                            method="post"
                            role="form"
                            th:action="@{/login}"
                            class="form-horizontal"
                    >
                        <div class="form-group mb-3">
                            <label class="control-label"> Email</label>
                            <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Unesite email adresu"
                            />
                        </div>

                        <div class="form-group mb-3">
                            <label class="control-label"> Lozinka</label>
                            <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Unesite lozinku"
                            />
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-warning" >Potvrdi</button>
                            <span> Nemate račun ?
                                <a th:href="@{/register}">Registrirajte se</a>
                            </span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!--Footer-->

<footer class="bg-warning text-center text-lg-start text-white mt-5 animate__animated animate__fadeInRightBig"
        style="position: fixed; bottom: 0; width: 100%;">
    <div class="container text-center p-3">
        © 2024 Copyright:
        <a class="text-light" href="/index">udomi.ba</a>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"></script>
<!-- Popper.js (required for Bootstrap's JS) via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<!-- jQuery (required for Bootstrap's JS) via CDN -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
</body>
</html>
